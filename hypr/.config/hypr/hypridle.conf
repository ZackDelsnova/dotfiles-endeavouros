# hypridle: auto-lock + screen off. Started from hyprland.lua (hl.exec_cmd("hypridle")).
# Lock only — no suspend listener: Docker and background services keep running.
# dpms uses the Hyprland 0.57 Lua dispatch form; plain `hyprctl dispatch dpms on` errors under the Lua config.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
}

listener {
    timeout = 600
    on-timeout = hyprlock
}

listener {
    timeout = 660
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms("on")'
}
