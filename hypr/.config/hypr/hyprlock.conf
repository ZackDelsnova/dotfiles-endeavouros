# hyprlock
general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/Pictures/Wallpapers/jeanne-alter.jpg
    blur_passes = 3
    blur_size = 8
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    outer_color = rgba(255,255,255,0.2)
    inner_color = rgba(0,0,0,0.4)
    font_color = #cdd6f4
    fade_on_empty = false
    placeholder_text = Password...
    position = 0, -80
    halign = center
    valign = center
}
