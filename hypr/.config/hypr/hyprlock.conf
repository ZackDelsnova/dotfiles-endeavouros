# hyprlock
# matugen-generated palette ($primary, $outer, $inner, $font, $error)
source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/Pictures/Wallpapers/jeanne-alter.jpg
    blur_passes = 3
    blur_size = 8
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    outer_color = $outer
    inner_color = $inner
    font_color = $font
    fade_on_empty = false
    placeholder_text = Password...
    position = 0, -80
    halign = center
    valign = center
}
