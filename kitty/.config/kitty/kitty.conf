font_family JetBrainsMono Nerd Font

# glass: translucent default background. Hyprland's global decoration:blur blurs behind it
# (verified: no window rule needed). Text and cells with their own background stay opaque.
background_opacity 0.85
# Allows live opacity changes (ctrl+shift+a>m / ctrl+shift+a>l). Per kitty docs this cannot be
# toggled by a config reload: it only applies to kitty instances started after it's set.
dynamic_background_opacity yes

# matugen-generated colors (relative to this file's directory)
include colors.conf
